<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Illustration of a portable Bluetooth speaker">
  <defs>
    <radialGradient id="ag-speaker" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2563eb" stop-opacity=".28"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <filter id="ash-speaker" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
    <linearGradient id="spG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e293b"/><stop offset=".45" stop-color="#334155"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
 <pattern id="grille" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="2" fill="#020617" opacity=".75"/></pattern>
  </defs>
  <ellipse cx="200" cy="205" rx="165" ry="160" fill="url(#ag-speaker)"/>
  <ellipse cx="200" cy="338" rx="108" ry="13" fill="#000" opacity=".42" filter="url(#ash-speaker)"/>
